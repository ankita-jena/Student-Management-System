<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>EduManage PRO | Ankita Jena</title>
    <style>
        body{font-family: 'Segoe UI', Arial; background:#eef2f7; margin:0; padding:20px}
        .container{max-width:1100px; margin:auto}
        .header{background:linear-gradient(90deg,#2c3e50,#3498db); color:white; padding:20px; border-radius:12px; text-align:center}
        .card{background:white; padding:20px; border-radius:12px; margin-top:20px; box-shadow:0 4px 15px rgba(0,0,0,0.1)}
        input{padding:10px; margin:5px; border:1px solid #ddd; border-radius:6px; width:18%}
        .btn{padding:10px 18px; background:#3498db; color:white; border:none; border-radius:6px; cursor:pointer}
        .btn-del{background:#e74c3c; text-decoration:none; padding:6px 12px; border-radius:5px; color:white}
        table{width:100%; border-collapse:collapse; margin-top:20px}
        th,td{padding:12px; border-bottom:1px solid #eee; text-align:left}
        th{background:#2c3e50; color:white}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎓 EduManage - Student Management System</h1>
        <p>CodSoft Internship Task 1 | By Ankita Jena | Batch C29</p>
    </div>

    <div class="card">
        <h3>Add New Student</h3>
        <form th:action="@{/save}" th:object="${student}" method="post">
            <input type="text" th:field="*{name}" placeholder="Full Name" required>
            <input type="text" th:field="*{rollNo}" placeholder="Roll No" required>
            <input type="text" th:field="*{branch}" placeholder="Branch (CSE)" required>
            <input type="email" th:field="*{email}" placeholder="Email" required>
            <button class="btn" type="submit">+ Add Student</button>
        </form>

        <table>
            <tr><th>ID</th><th>Roll No</th><th>Name</th><th>Branch</th><th>Email</th><th>Action</th></tr>
            <tr th:each="s : ${students}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.rollNo}"></td>
                <td th:text="${s.name}"></td>
                <td th:text="${s.branch}"></td>
                <td th:text="${s.email}"></td>
                <td><a th:href="@{/delete/{id}(id=${s.id})}" class="btn-del">Delete</a></td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
